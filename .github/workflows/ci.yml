name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least-privilege token by default.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, type, test, mutation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (type check)
        run: mypy cicero

      - name: Pytest (unit + integration, providers mocked)
        run: pytest --cov=cicero --cov-report=term-missing

      # J4 / requirements §9: walk the whole release path against a real server
      # (offline mock providers) and print the acceptance checklist into the log.
      - name: End-to-end release demo
        run: |
          python scripts/demo.py \
            --participant Ada:mock:mock-small:pro \
            --participant Zeno:mock:mock-large:con \
            --compare --out demo-output

      - name: Mutation testing (quality gate)
        run: |
          mutmut run || true
          python scripts/check_mutation_score.py --min 80

  frontend:
    name: Frontend — typecheck, lint, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # A6 / NFR-O-2: the self-hosted stack is only real if it actually builds and
  # serves. This starts it exactly as an operator would and drives the same
  # path through nginx, so a broken Dockerfile, a wrong build context, or a
  # missing proxy route fails the build rather than the first person to try it.
  docker:
    name: Docker — build and smoke-test the stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: API is healthy behind nginx
        run: |
          curl --fail --silent --show-error http://localhost:8080/health | tee /dev/stderr | grep -q '"status":"ok"'

      - name: UI is served
        run: |
          curl --fail --silent --show-error http://localhost:8080/ | grep -qi "<div id=\"root\">"

      # Proves the reverse proxy carries a real API round-trip, not just /health.
      - name: A chamber can be created and read back through the proxy
        run: |
          created=$(curl --fail --silent --show-error \
            -H 'content-type: application/json' \
            -d '{"topic":"Does the container stack work?"}' \
            http://localhost:8080/chambers)
          echo "$created"
          id=$(echo "$created" | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          curl --fail --silent --show-error "http://localhost:8080/chambers/$id" | grep -q "$id"

      - name: Capability probe is proxied (the /config route)
        run: curl --fail --silent --show-error http://localhost:8080/config | grep -q web_access_enabled

      - name: The API image does not run as root
        run: |
          test "$(docker compose exec -T backend id -u)" != "0"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks binary, not gitleaks-action@v2. The action is free for
      # individual accounts but licensed for organizations, and it decides which
      # you are by calling api.github.com/users/<owner>. When that call fails it
      # fails *closed* — demanding a GITLEAKS_LICENSE that a personal account
      # does not need — so a transient network error reddens the build without
      # ever scanning anything. Observed: the same commit passed on the
      # pull_request run and failed on the push run with "self-signed
      # certificate ... License key validation will be enforced".
      #
      # Running the binary removes the licence check from the path entirely.
      # Pinned so a scanner release cannot change the verdict on unchanged code.
      - name: Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          # --redact so a finding never prints the secret into a public log.
          ./gitleaks git --no-banner --redact --verbose .

  dependency-scan:
    name: Dependency (SCA) scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install project + audit tool
        run: |
          uv pip install --system -e ".[dev]"
          # Keep build-time tooling on non-vulnerable versions (PYSEC-2026-3447).
          uv pip install --system pip-audit "setuptools>=83.0.0"

      - name: pip-audit (fail on known vulnerabilities)
        run: pip-audit --strict --desc
