[project]
name = "cicero"
version = "0.1.0"
description = "Cicero — a virtual debate chamber for pitting LLMs against one another."
# No `readme`. It pointed at ../README.md, which newer hatchling rejects
# ("Readme path must be within the project directory"), breaking every job that
# installs the package — backend, SCA scan and the Docker build alike. This is a
# private package that is never published, so the long description bought
# nothing; the root README is still the project's documentation.
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "sqlalchemy>=2.0,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "mutmut>=2.4,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cicero"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, comprehensions, pyupgrade, security (bandit-ish)
select = ["E", "F", "I", "B", "C4", "UP", "S"]
# Assert use is fine in tests.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = [
    # Spawns a real server/subprocess: run in CI, skipped by the mutation gate
    # (see setup.cfg) so mutmut does not pay for it once per mutant.
    "e2e: end-to-end demo run against a live API process",
]

[tool.coverage.run]
source = ["cicero"]
branch = true
