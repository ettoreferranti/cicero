# Mutation-testing configuration (mutmut 2.x).
#
# Mutation testing is Cicero's real quality signal (see docs/testing.md, NFR-Q-2).
# We mutate the pure, high-value core logic and require our tests to *kill* the
# mutants. Keep paths scoped so CI stays fast; broaden over time.
# We mutate genuine behavioural logic and require the tests to *kill* the
# mutants. Purely declarative modules are intentionally excluded from the gate
# (their mutants are dominated by equivalent/constraint-boundary changes) but are
# still covered by ordinary validation unit tests — see docs/testing.md §3.1:
#   - domain/enums.py, domain/models.py  → Pydantic/enum field declarations
#   - providers/base.py                  → interface + DTO declarations
#   - providers/ollama.py, anthropic.py  → HTTP I/O adapters (tested via
#                                          MockTransport); their *retry policy*
#                                          lives in providers/retry.py, which
#                                          IS in the gate
#   - providers/factory.py               → construction/wiring
#   - persistence/repository.py          → abstract interface
#   - persistence/sqlalchemy_repo.py     → ORM table/column declarations
#   - core/prompts.py                    → prompt template *text* (prose)
#   - api/* (except rate_limit.py)       → HTTP layer (tested via TestClient)
#   - tools/web.py                       → network adapter; its SSRF/sanitise
#                                          policy is unit-tested via fake
#                                          resolvers + MockTransport, but the
#                                          module is dominated by I/O plumbing
#                                          and error-message strings
#   - config.py, **/__init__.py          → settings + re-exports
[mutmut]
paths_to_mutate=cicero/core/budget.py,cicero/core/roster.py,cicero/core/repetition.py,cicero/core/state_machine.py,cicero/core/prompt_builder.py,cicero/core/consensus.py,cicero/core/orchestrator.py,cicero/core/compare.py,cicero/core/research.py,cicero/core/recovery.py,cicero/core/metrics.py,cicero/core/export.py,cicero/api/rate_limit.py,cicero/providers/mock.py,cicero/providers/retry.py,cicero/providers/availability.py,cicero/persistence/memory.py,cicero/core/outcome.py
tests_dir=tests/
# ``-m "not e2e"`` keeps the live-server demo test (tests/test_demo_e2e.py) out of
# the per-mutant run — it spawns a real API process and would dominate the gate.
runner=python -m pytest -q -x --no-header -p no:cacheprovider -m "not e2e"
