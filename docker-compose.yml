# Cicero — self-hosted stack (A6 / NFR-O-2).
#
#   docker compose up --build      → UI on http://localhost:8080
#
# Both ports are published to 127.0.0.1 only, matching the API's localhost
# default (NFR-SEC-9): nothing here is exposed to your network unless you
# deliberately change that *and* set API_AUTH_TOKEN.
#
# Secrets come from a git-ignored `.env` beside this file (compose reads it
# automatically). Nothing sensitive is baked into an image.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # Inside the container we must bind all interfaces; the published port
      # below is what keeps it reachable from localhost only.
      - API_HOST=0.0.0.0
      - DATABASE_URL=sqlite:////data/cicero.db
      # The UI is same-origin behind nginx, so CORS stays empty by default.
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-[]}
      # Reach an Ollama running on the host, not in this network.
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-240}
      # Web evidence is off by default and also needs per-chamber opt-in
      # (FR-27). The tuning vars below travel with the flag on purpose: without
      # them a WEB_DOMAIN_ALLOWLIST set in .env would be read on a bare-metal
      # run and silently ignored here, so an operator who restricted fetching to
      # a few hosts would get an unrestricted container and no warning. The
      # allowlist is the recommended mitigation for strict setups (see
      # cicero/tools/web.py), which is exactly why it must not go missing.
      - WEB_ACCESS_ENABLED=${WEB_ACCESS_ENABLED:-false}
      - WEB_DOMAIN_ALLOWLIST=${WEB_DOMAIN_ALLOWLIST:-[]}
      - WEB_DOMAIN_DENYLIST=${WEB_DOMAIN_DENYLIST:-[]}
      - WEB_FETCH_TIMEOUT_SECONDS=${WEB_FETCH_TIMEOUT_SECONDS:-10}
      - WEB_MAX_RESPONSE_BYTES=${WEB_MAX_RESPONSE_BYTES:-2000000}
      - WEB_MAX_RESULTS=${WEB_MAX_RESULTS:-3}
      - PROVIDER_MAX_ATTEMPTS=${PROVIDER_MAX_ATTEMPTS:-3}
      # Pass-through form (no `=`): these reach the container only when they are
      # actually set. Writing `FOO=${FOO:-}` would inject an empty string, and
      # an empty API_AUTH_TOKEN enables auth with a token nobody can send.
      - ANTHROPIC_API_KEY
      - API_AUTH_TOKEN
    volumes:
      - cicero-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      # Docker Desktop provides this automatically; on Linux it needs saying.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  cicero-data:
