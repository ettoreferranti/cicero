# Serves the built SPA and reverse-proxies the API to the backend service, so
# the app is same-origin end to end (A6).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The SPA owns client-side routing: unknown paths return the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API ---------------------------------------------------------------
    # Keep this list in step with the dev-server proxy in vite.config.ts.
    location ~ ^/(chambers|providers|health|config) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Server-Sent Events: the debate stream must not be buffered or timed
        # out mid-debate, and chunked responses have to flow through as they
        # are produced (FR-18).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_set_header Connection "";
    }
}
